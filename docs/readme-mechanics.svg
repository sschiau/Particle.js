<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Three pieces. One exact ID.</title>
  <desc id="desc">Elapsed time 1 millisecond, allocated machine 1, and counter 0 combine into ID 4198400 using the 41/10/12-bit layout.</desc>
  <rect width="1200" height="390" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#e5e5e9"><rect x="80" y="48" width="320" height="148" rx="18"/><rect x="440" y="48" width="320" height="148" rx="18"/><rect x="800" y="48" width="320" height="148" rx="18"/></g>
    <g fill="#55555d" font-size="15" font-weight="500"><text x="240" y="83">TIME</text><text x="600" y="83">MACHINE</text><text x="960" y="83">COUNTER</text></g>
    <g fill="#1d1d1f" font-size="48" font-weight="600" letter-spacing="-2"><text x="240" y="139">1 ms</text><text x="600" y="139">1</text><text x="960" y="139">0</text></g>
    <g fill="#62626a" font-size="14"><text x="240" y="171">since the shared epoch · 41 bits</text><text x="600" y="171">allocated to this generator · 10 bits</text><text x="960" y="171">within this millisecond · 12 bits</text></g>
    <path d="M240 196v28q0 12 12 12h696q12 0 12-12v-28M600 196v62" fill="none" stroke="#a0a0aa" stroke-width="1.5"/>
    <path d="m595 253 5 5 5-5" fill="none" stroke="#a0a0aa" stroke-width="1.5"/>
    <text x="600" y="308" fill="#1d1d1f" font-size="46" font-weight="600" letter-spacing="-1.5">4198400</text>
    <text x="600" y="344" fill="#55555d" font-size="16">An exact integer. Ready to travel as a decimal string.</text>
  </g>
</svg>
