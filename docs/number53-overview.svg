<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Forty time bits. Ten machine bits. Three counter bits.</title>
<desc id="desc">Elapsed time one millisecond, machine one, and counter zero combine into exact Number ID 8200. There are 1024 machine values and eight counter values per millisecond.</desc>
<rect width="1200" height="390" rx="24" fill="#f5f5f7"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
<g fill="#fff" stroke="#e1e4e8"><rect x="72" y="46" width="328" height="150" rx="18"/><rect x="436" y="46" width="328" height="150" rx="18"/><rect x="800" y="46" width="328" height="150" rx="18"/></g>
<g fill="#55555d" font-size="15" font-weight="500" letter-spacing="1"><text x="236" y="81">TIME</text><text x="600" y="81">MACHINE</text><text x="964" y="81">COUNTER</text></g>
<g fill="#1d1d1f" font-size="46" font-weight="600" letter-spacing="-1.5"><text x="236" y="138">1 ms</text><text x="600" y="138">1</text><text x="964" y="138">0</text></g>
<g fill="#62626a" font-size="14"><text x="236" y="171">since your epoch · 40 bits</text><text x="600" y="171">allocated from 0–1023 · 10 bits</text><text x="964" y="171">values 0–7 per millisecond · 3 bits</text></g>
<path d="M236 196v27q0 13 13 13h702q13 0 13-13v-27M600 196v63" fill="none" stroke="#9b9ba5" stroke-width="1.5"/>
<path d="m595 254 5 5 5-5" fill="none" stroke="#9b9ba5" stroke-width="1.5"/>
<text x="600" y="309" fill="#1d1d1f" font-size="47" font-weight="600" letter-spacing="-1.5">8200</text>
<text x="600" y="345" fill="#55555d" font-size="16">An exact Number. Ready for JSON.</text>
</g></svg>
