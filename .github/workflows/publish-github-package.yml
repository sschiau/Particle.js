name: Publish Particle 4.0.1 to GitHub Packages

# One-off, manual publication of the reviewed exact-Number implementation.
# Existing test, CodeQL, and npmjs publishing workflows are unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: particle-github-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sschiau/Particle.js' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the reviewed 4.0.1 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 290657bc0ebb83e9bb139ca348b291833fcb3f96
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Prepare and verify the scoped package
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')
          const root = process.cwd()
          const output = path.join(process.env.RUNNER_TEMP, 'particle-github-package')
          fs.mkdirSync(output)
          const runNpm = (args, cwd) => execFileSync('npm', args, { cwd, encoding: 'utf8' })
          const unpackResult = text => {
            const value = JSON.parse(text)
            return Array.isArray(value) ? value[0] : value.filename ? value : Object.values(value)[0]
          }
          const original = require(path.join(root, 'package.json'))
          assert.equal(original.name, 'Particle')
          assert.equal(original.version, '4.0.1')
          assert.deepEqual(original.dependencies, {})
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          assert.equal(sourceCommit, '290657bc0ebb83e9bb139ca348b291833fcb3f96')
          const packed = unpackResult(runNpm(['pack', '--json', '--ignore-scripts', '--pack-destination', output], root))
          execFileSync('tar', ['-xzf', path.join(output, packed.filename), '-C', output])
          const staging = path.join(output, 'package')
          const manifestPath = path.join(staging, 'package.json')
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          manifest.name = '@sschiau/particle'
          manifest.repository = { type: 'git', url: 'git+https://github.com/sschiau/Particle.js.git' }
          manifest.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' }
          manifest.gitHead = sourceCommit
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n')
          const scoped = unpackResult(runNpm(['pack', '--json', '--ignore-scripts', '--pack-destination', output], staging))
          assert.equal(scoped.filename, 'sschiau-particle-4.0.1.tgz')
          const consumer = path.join(output, 'consumer')
          fs.mkdirSync(consumer)
          fs.writeFileSync(path.join(consumer, 'package.json'), JSON.stringify({ name: 'particle-package-check', private: true }))
          runNpm(['install', '--offline', '--ignore-scripts', '--no-audit', '--no-fund', path.join(output, scoped.filename)], consumer)
          const smoke = `
            const assert = require('node:assert/strict')
            const P = require('@sschiau/particle')
            const B = require('@sschiau/particle/binary.js')
            assert.equal(P.version, '4.0.1')
            assert.equal(P, globalThis.Particle)
            P.machineId = 1; P.epoch = 1480657492000
            const nativeNow = Date.now
            Date.now = () => P.epoch + 1
            try {
              const ids = Array.from({ length: 8 }, () => P.generateParticle())
              assert.equal(new Set(ids).size, 8)
              assert.ok(ids.every(Number.isSafeInteger))
              assert.deepEqual(JSON.parse(JSON.stringify(ids)), ids)
              assert.deepEqual(Array.from(B.decodeNumberPayload(B.encodeNumberPayload(ids))), ids)
              assert.throws(() => P.generateParticle(), { code: 'ERR_SEQUENCE_EXHAUSTED' })
            } finally { Date.now = nativeNow }
          `
          execFileSync(process.execPath, ['--disallow-code-generation-from-strings', '-e', smoke], { cwd: consumer, stdio: 'inherit' })
          for (const file of ['Sources/Particle.js', 'Sources/binary.js', 'binary.js', 'docs/number53-overview.svg']) {
            assert.deepEqual(fs.readFileSync(path.join(consumer, 'node_modules/@sschiau/particle', file)), fs.readFileSync(path.join(root, file)))
          }
          console.log('Verified @sschiau/particle@4.0.1 from reviewed commit ' + sourceCommit)
          NODE

      - name: Publish only to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/particle-github-publish.npmrc
        shell: bash
        run: |
          umask 077
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '%s\n' '@sschiau:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          npm publish "$RUNNER_TEMP/particle-github-package/sschiau-particle-4.0.1.tgz" --registry=https://npm.pkg.github.com --access public --ignore-scripts
          npm view @sschiau/particle@4.0.1 version repository --json --registry=https://npm.pkg.github.com
          printf '%s\n' 'Published @sschiau/particle@4.0.1 to GitHub Packages.' 'npmjs and its dist-tags were not changed.' 'Check package visibility in repository Packages settings before sharing publicly.' >> "$GITHUB_STEP_SUMMARY"
